# Builds the game client for each supported platform and uploads the
# resulting game directory (binaries only, no Valve assets) as an artifact.
#
# Kisak-Strike writes its runtime binaries to ../game, a sibling of the source
# tree, so the repository is checked out into src/ and the build lands in
# game/ inside the workspace.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Release builds without debug info: CI would only strip it again. The
  # default CPU target (x86-64-v2 / apple-m1) keeps the binaries portable.
  CMAKE_ARGS: >-
    -G Ninja
    -DCMAKE_BUILD_TYPE=Release
    -DRELEASE_DEBUG_INFO=OFF
    -DUSE_KISAK_PHYSICS=ON
    -DCMAKE_C_COMPILER_LAUNCHER=ccache
    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_MAXSIZE: 2G

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          path: src

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            libsdl2-dev libsdl2-mixer-dev libopenal-dev \
            libcurl4-openssl-dev libssl-dev libfontconfig1-dev libglu1-mesa-dev

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-x64-${{ github.sha }}
          restore-keys: ccache-linux-x64-

      - name: Configure
        run: cmake -S src -B build $CMAKE_ARGS

      - name: Build
        run: cmake --build build && ccache --show-stats

      # A tarball keeps the executable bits that artifact zips drop.
      - name: Package
        run: tar -C game -czf csgo-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: csgo-linux-x64
          path: csgo-linux-x64.tar.gz
          compression-level: 0
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    # Apple Silicon runner; the build refuses Intel Macs.
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          path: src

      - name: Install dependencies
        run: |
          # The toolchain file calls the Command Line Tools directly.
          test -x /Library/Developer/CommandLineTools/usr/bin/clang++
          test -d /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          brew install ninja sdl2-compat ccache

      # tools/install_macos_launcher.sh compiles the launcher on the user's Mac;
      # type-check it here so a broken launcher fails CI instead.
      - name: Type-check the launcher
        run: |
          /Library/Developer/CommandLineTools/usr/bin/swiftc -swift-version 5 -parse-as-library -typecheck \
            -target arm64-apple-macosx12.0 -sdk /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk \
            src/tools/macos_launcher/Launcher.swift

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-arm64-${{ github.sha }}
          restore-keys: ccache-macos-arm64-

      - name: Configure
        run: |
          cmake -S src -B build $CMAKE_ARGS \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/src/cmake/toolchains/macos-arm64.cmake"

      - name: Build
        run: cmake --build build && ccache --show-stats

      # A tarball keeps the executable bits that artifact zips drop.
      - name: Package
        run: tar -C game -czf csgo-macos-arm64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: csgo-macos-arm64
          path: csgo-macos-arm64.tar.gz
          compression-level: 0
          if-no-files-found: error
